<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rede AlimentaMS</title>
<style>
  :root {
    --verde: #2e7d32; --verde-esc: #1b5e20; --fundo: #eef1f5; --card: #fff;
    --texto: #1f2937; --suave: #6b7280; --borda: #e5e7eb;
    --azul: #1e88e5; --laranja: #fb8c00; --teal: #00897b; --verm: #c62828;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto); }
  header { background: var(--verde); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.25rem; }
  header small { opacity: .85; display: block; }
  .sessao { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
  main { max-width: 1000px; margin: 0 auto; padding: 18px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 6px; padding: 8px 14px; background: var(--verde); color: #fff; }
  button:hover { background: var(--verde-esc); }
  button.sec { background: transparent; border: 1px solid #fff; }
  button.azul { background: var(--azul); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #90caf9; outline-offset: 1px; }
  input, select { font: inherit; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 6px; width: 100%; background: #fff; }
  label { display: block; font-size: .85rem; color: var(--suave); margin: 10px 0 4px; }
  .painel { background: var(--card); border-radius: 10px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .login { max-width: 420px; margin: 30px auto; }
  .login h2 { margin-top: 0; }
  .demo { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .demo button { background: #e8f5e9; color: var(--verde-esc); font-size: .8rem; padding: 6px 10px; }
  .link { background: none; color: var(--azul); padding: 0; text-decoration: underline; }
  .link:hover { background: none; }
  .msg { padding: 10px 12px; border-radius: 6px; margin: 12px 0; font-size: .92rem; }
  .msg.erro { background: #ffebee; color: var(--verm); }
  .msg.ok { background: #e8f5e9; color: var(--verde-esc); }
  .indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .ind { color: #fff; border-radius: 10px; padding: 16px; }
  .ind b { font-size: 1.9rem; display: block; }
  .ind span { font-size: .85rem; opacity: .95; }
  .nota { font-size: .75rem; color: var(--suave); font-style: italic; margin: 6px 0 14px; }
  nav.abas { display: flex; gap: 4px; border-bottom: 2px solid var(--borda); margin-bottom: 16px; }
  nav.abas button { background: none; color: var(--suave); border-radius: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  nav.abas button.ativa { color: var(--verde-esc); border-color: var(--verde); font-weight: 600; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .lote { background: var(--card); border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-left: 4px solid var(--verde); }
  .lote.reservado { border-left-color: var(--azul); }
  .lote.expirado { border-left-color: #9e9e9e; opacity: .8; }
  .secao { margin: 18px 0 10px; font-size: 1rem; color: var(--suave); }
  .miniatura { display: block; width: 100%; max-height: 150px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; background: var(--fundo); }
  .previa-foto { display: block; max-width: 220px; max-height: 160px; border-radius: 6px; margin-top: 8px; }
  .janela { margin-top: 8px; }
  .janela .linha2 { grid-template-columns: 1fr; gap: 0; }
  .lote .topo { display: flex; justify-content: space-between; gap: 8px; }
  .lote h3 { margin: 0; font-size: 1.05rem; }
  .qtd { color: var(--verde); font-weight: 700; font-size: 1.4rem; white-space: nowrap; }
  .meta { color: var(--suave); font-size: .88rem; margin: 6px 0; }
  .tag { display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: .78rem; font-weight: 600; }
  .t-hoje { background: #ffebee; color: var(--verm); }
  .t-breve { background: #fff3e0; color: #e65100; }
  .t-ok { background: #e8f5e9; color: var(--verde-esc); }
  .t-res { background: #e3f2fd; color: #0d47a1; }
  .codigo { border: 1px dashed var(--azul); background: #e3f2fd; padding: 10px; border-radius: 6px; margin: 8px 0; color: #0d47a1; }
  .codigo b { font-size: 1.4rem; letter-spacing: 4px; }
  .acao { display: flex; gap: 8px; align-items: center; margin-top: 10px; justify-content: space-between; }
  .acao input { max-width: 130px; }
  .sanitario { border: 1px solid var(--borda); border-radius: 6px; margin: 10px 0; padding: 8px; }
  .sanitario input { width: auto; margin-right: 6px; }
  .sanitario label { color: var(--texto); }
  .qr-retirada { display: block; width: 220px; max-width: 100%; margin: 8px auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; font-size: .9rem; }
  th { background: var(--verde); color: #fff; text-align: left; padding: 10px; }
  td { padding: 10px; border-bottom: 1px solid var(--borda); }
  .rolagem { overflow-x: auto; }
  .vazio { text-align: center; color: var(--suave); padding: 30px; background: var(--card); border-radius: 10px; }
  .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { .linha2 { grid-template-columns: 1fr; } }
  .sino { position: relative; padding: 6px 10px; }
  .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; padding: 1px 5px; border-radius: 10px; background: var(--verm); color: #fff; font-size: .75rem; font-weight: 700; text-align: center; }
  .central { position: fixed; top: 64px; right: 12px; width: min(380px, calc(100vw - 24px)); max-height: 70vh; overflow: hidden auto; overflow-wrap: anywhere; z-index: 10; background: var(--card); color: var(--texto); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.25); padding: 12px; }
  .central h2 { margin: 0 0 8px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .central h2 button { font-size: .8rem; padding: 4px 8px; }
  .notif { border: 1px solid var(--borda); border-left: 4px solid var(--borda); border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: .9rem; }
  .notif.nova { border-left-color: var(--azul); background: #f3f8fe; }
  .notif.urgente { border-left-color: var(--verm); }
  .notif small { display: block; color: var(--suave); margin-top: 4px; }
  .notif button { font-size: .78rem; padding: 3px 8px; margin-left: 6px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 11; max-width: min(480px, calc(100vw - 24px)); background: #263238; color: #fff; border-radius: 8px; padding: 10px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.3); font-size: .92rem; }
  .toast.urgente { background: var(--verm); }
  .toast button { margin-left: 8px; padding: 3px 8px; font-size: .8rem; background: #fff; color: var(--texto); }
  label.aceite { display: flex; gap: 8px; align-items: flex-start; color: var(--texto); margin: 14px 0 4px; }
  label.aceite input { width: auto; margin-top: 3px; }
  .ind small { display: block; margin-top: 6px; font-size: .78rem; opacity: .95; }
  .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 16px; }
  .campos div { padding: 4px 0; border-bottom: 1px solid var(--borda); font-size: .92rem; }
  .campos b { display: block; color: var(--suave); font-weight: 600; font-size: .78rem; }
  .oculto { display: none !important; }
</style>
</head>
<body>

<header>
  <div><h1>Rede AlimentaMS</h1><small>Campo Grande - MS</small></div>
  <div class="sessao oculto" id="sessao">
    <button class="sec sino" id="sino" onclick="alternarCentral()" aria-label="Notificações" aria-expanded="false" aria-controls="central">&#128276;<span class="badge oculto" id="contador">0</span></button>
    <span id="quem"></span>
    <button class="sec" onclick="sair()">Sair</button>
  </div>
</header>
<section class="central oculto" id="central" aria-label="Central de notificações"></section>
<div class="toast oculto" id="toast" role="status" aria-live="polite"></div>

<main>
  <!-- LOGIN / CADASTRO -->
  <section id="telaAuth" class="painel login">
    <div id="boxLogin">
      <h2>Entrar</h2>
      <label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username">
      <label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password">
      <div id="erroLogin"></div>
      <p><button onclick="entrar()">Entrar</button></p>
      <p class="meta">Contas de demonstração (senha 123456):</p>
      <div class="demo">
        <button onclick="demo('comper@demo.com')">Doador: Comper</button>
        <button onclick="demo('sabor@demo.com')">Doador: Sabor MS</button>
        <button onclick="demo('esperanca@demo.com')">ONG: Casa Esperança</button>
        <button onclick="demo('amambai@demo.com')">ONG: Cozinha Amambai</button>
      </div>
      <p class="meta">Ainda não tem conta? <button class="link" onclick="trocar(true)">Cadastre-se</button></p>
    </div>
    <div id="boxCadastro" class="oculto">
      <h2>Criar conta</h2>
      <label for="cPerfil">Tipo de conta</label>
      <select id="cPerfil" onchange="alternarComprovante()"><option value="doador">Estabelecimento doador</option><option value="receptora">Entidade receptora (ONG)</option></select>
      <label for="cNome">Nome / Razão social</label><input id="cNome" maxlength="200">
      <label for="cCnpj">CNPJ</label><input id="cCnpj" placeholder="00.000.000/0000-00" inputmode="numeric" oninput="mascararCnpj(this)">
      <label for="cEndereco">Endereço</label><input id="cEndereco" maxlength="250" placeholder="Rua, número e complemento" autocomplete="street-address">
      <label for="cBairro">Bairro</label><select id="cBairro"></select>
      <label for="cResponsavel">Responsável</label><input id="cResponsavel" maxlength="200" autocomplete="name">
      <label for="cTelefone">Telefone do responsável</label><input id="cTelefone" placeholder="(67) 99999-9999" inputmode="tel" maxlength="20" oninput="mascararTelefone(this)" autocomplete="tel">
      <label for="cEmail">E-mail</label><input id="cEmail" type="email" maxlength="254">
      <label for="cSenha">Senha (mínimo 6 caracteres)</label><input id="cSenha" type="password" maxlength="72">
      <div id="boxComprovante" class="oculto">
        <label for="cComprovante">Comprovante de entidade sem fins lucrativos (opcional · PDF, JPEG ou PNG até 1 MB)</label>
        <input id="cComprovante" type="file" accept="application/pdf,image/jpeg,image/png">
      </div>
      <label class="aceite" for="cAceite"><input id="cAceite" type="checkbox"><span>Li e aceito o <a href="/termos.html#termo" target="_blank" rel="noopener">Termo de Responsabilidade</a> e a <a href="/termos.html#privacidade" target="_blank" rel="noopener">Política de Privacidade</a>.</span></label>
      <div id="erroCadastro"></div>
      <p><button onclick="cadastrar()">Criar conta</button></p>
      <p class="meta">Já tem conta? <button class="link" onclick="trocar(false)">Entrar</button></p>
    </div>
  </section>

  <!-- APLICAÇÃO -->
  <section id="telaApp" class="oculto">
    <div class="indicadores" id="indicadores"></div>
    <p class="nota">* Fatores de conversão (2 refeições, 2,5 kg CO₂e e 350 L de água por kg) usados apenas para fins de demonstração.</p>
    <nav class="abas" id="abas"></nav>
    <div id="conteudo"></div>
  </section>
</main>

<script>
let token = localStorage.getItem('token');
let usuario = JSON.parse(localStorage.getItem('usuario') || 'null');
let abaAtual = null;
let imagensTemporarias = []; // URLs de blob (QR e fotos) liberadas a cada recarga da lista
let fotoPronta = Promise.resolve(null); // foto escolhida no formulário, já reduzida (base64) ou em redução

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const msg = (id, texto, tipo = 'erro') => { $(id).innerHTML = texto ? `<div class="msg ${tipo}">${esc(texto)}</div>` : ''; };

async function api(metodo, url, corpo) {
  const r = await fetch(url, {
    method: metodo,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  const dados = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { sair(); throw new Error(dados.erro || 'Sessão expirada.'); }
  if (!r.ok) throw Object.assign(new Error(dados.erro || 'Erro inesperado.'), { status: r.status });
  return dados;
}

// ---------- Autenticação ----------
function mascararCnpj(input) {
  input.value = input.value.replace(/\D/g, '').slice(0, 14)
    .replace(/^(\d{2})(\d)/, '$1.$2')
    .replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3')
    .replace(/\.(\d{3})(\d)/, '.$1/$2')
    .replace(/(\d{4})(\d)/, '$1-$2');
}

// (67) 99999-9999 ou (67) 3333-0001; aceita colar com +55.
function mascararTelefone(input) {
  let d = input.value.replace(/\D/g, '');
  if (d.length > 11 && d.startsWith('55')) d = d.slice(2);
  d = d.slice(0, 11);
  input.value = d.length > 10 ? d.replace(/^(\d{2})(\d{5})(\d{0,4})$/, '($1) $2-$3')
    : d.length > 6 ? d.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3')
    : d.length > 2 ? d.replace(/^(\d{2})(\d{0,5})$/, '($1) $2') : d;
}

const COMPROVANTE_TIPOS = { 'application/pdf': 'PDF', 'image/jpeg': 'JPEG', 'image/png': 'PNG' };
const COMPROVANTE_BYTES_MAX = 1024 * 1024;

function validarArquivoComprovante(arquivo) {
  if (!COMPROVANTE_TIPOS[arquivo.type]) throw new Error('O comprovante deve ser um arquivo PDF, JPEG ou PNG.');
  if (arquivo.size > COMPROVANTE_BYTES_MAX) throw new Error('O comprovante deve ter no máximo 1 MB.');
}

async function enviarComprovante(arquivo) {
  validarArquivoComprovante(arquivo);
  return api('PUT', '/perfil/comprovante', { arquivo: await lerBase64(arquivo) });
}

// O anexo só existe para a entidade receptora.
function alternarComprovante() {
  $('boxComprovante').classList.toggle('oculto', $('cPerfil').value !== 'receptora');
}

function dataAmanha(agora = new Date()) {
  const partes = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Campo_Grande', year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(agora);
  const valor = (tipo) => partes.find((p) => p.type === tipo).value;
  const dia = new Date(`${valor('year')}-${valor('month')}-${valor('day')}T12:00:00Z`);
  dia.setUTCDate(dia.getUTCDate() + 1);
  return dia.toISOString().slice(0, 10);
}

// Data e hora de Campo Grande no formato AAAA-MM-DDTHH:MM (o mesmo aceito pela API).
function agoraLocal(agora = new Date(), minutos = 0) {
  const partes = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Campo_Grande', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).formatToParts(new Date(agora.getTime() + minutos * 60000));
  const valor = (tipo) => partes.find((p) => p.type === tipo).value;
  return `${valor('year')}-${valor('month')}-${valor('day')}T${valor('hour')}:${valor('minute')}`;
}

function diaSeguinte(iso) {
  const dia = new Date(`${iso}T12:00:00Z`);
  dia.setUTCDate(dia.getUTCDate() + 1);
  return dia.toISOString().slice(0, 10);
}

function trocar(cadastro) {
  $('boxLogin').classList.toggle('oculto', cadastro);
  $('boxCadastro').classList.toggle('oculto', !cadastro);
}
function demo(email) { $('lEmail').value = email; $('lSenha').value = '123456'; entrar(); }

async function entrar() {
  try {
    const d = await api('POST', '/auth/login', { email: $('lEmail').value, senha: $('lSenha').value });
    iniciarSessao(d);
  } catch (e) { msg('erroLogin', e.message); }
}
async function cadastrar() {
  try {
    const arquivo = $('cPerfil').value === 'receptora' ? $('cComprovante').files[0] : null;
    if (arquivo) validarArquivoComprovante(arquivo);
    const d = await api('POST', '/auth/register', {
      perfil: $('cPerfil').value, nome: $('cNome').value, cnpj: $('cCnpj').value,
      endereco: $('cEndereco').value, responsavel: $('cResponsavel').value, telefone: $('cTelefone').value,
      bairro: $('cBairro').value, email: $('cEmail').value, senha: $('cSenha').value,
      aceite_termos: $('cAceite').checked,
    });
    // O comprovante vai logo depois, já com a sessão da conta recém-criada; se falhar, a conta continua válida.
    let falhaAnexo = null;
    if (arquivo) {
      token = d.token;
      try { await enviarComprovante(arquivo); } catch (e) { falhaAnexo = e.message; }
    }
    iniciarSessao(d);
    if (falhaAnexo) mostrarAviso(`Conta criada, mas o comprovante não foi enviado: ${falhaAnexo} Envie-o em "Meus números".`, true);
  } catch (e) { msg('erroCadastro', e.message); }
}
function iniciarSessao(d) {
  token = d.token; usuario = d.usuario;
  localStorage.setItem('token', token);
  localStorage.setItem('usuario', JSON.stringify(usuario));
  mostrarApp();
}
function sair() {
  token = null; usuario = null;
  localStorage.removeItem('token'); localStorage.removeItem('usuario');
  pararTempoReal();
  $('telaApp').classList.add('oculto'); $('sessao').classList.add('oculto');
  $('telaAuth').classList.remove('oculto');
  msg('erroLogin', ''); msg('erroCadastro', '');
  $('cSenha').value = ''; $('cAceite').checked = false; $('cComprovante').value = '';
  trocar(false);
}

// ---------- Aplicação ----------
function mostrarApp() {
  $('telaAuth').classList.add('oculto');
  $('telaApp').classList.remove('oculto');
  $('sessao').classList.remove('oculto');
  $('quem').textContent = `${usuario.nome} (${usuario.perfil === 'doador' ? 'Doador' : 'Entidade receptora'})`;
  iniciarTempoReal();
  const abas = usuario.perfil === 'doador'
    ? [['lotes', 'Meus lotes'], ['publicar', 'Publicar lote'], ['doacoes', 'Doações registradas'], ['numeros', 'Meus números']]
    : [['lotes', 'Lotes disponíveis'], ['doacoes', 'Doações recebidas'], ['numeros', 'Meus números']];
  $('abas').innerHTML = abas.map(([id, nome]) => `<button data-aba="${id}" onclick="irPara('${id}')">${nome}</button>`).join('');
  irPara('lotes');
}

async function irPara(aba) {
  abaAtual = aba;
  document.querySelectorAll('#abas button').forEach((b) => b.classList.toggle('ativa', b.dataset.aba === aba));
  carregarIndicadores();
  carregarNotificacoes();
  try {
    if (aba === 'lotes') await telaLotes();
    else if (aba === 'publicar') telaPublicar();
    else if (aba === 'numeros') await telaNumeros();
    else await telaDoacoes();
  } catch (e) { $('conteudo').innerHTML = `<div class="msg erro">${esc(e.message)}</div>`; }
}

// Cartões do painel (global e "Meus números"): TMR e TEC levam a meta ao lado e se está atingida.
function htmlIndicadores(i, { entidades = ['entidades beneficiadas', i.entidades], doacoes = false } = {}) {
  const f = (n) => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  const situacao = (atingida) => (atingida === null ? 'sem dados ainda' : atingida ? 'meta atingida' : 'meta não atingida');
  return `
    <div class="ind" style="background:var(--verde)"><b>${f(i.kg)}</b><span>kg salvos do descarte</span></div>
    <div class="ind" style="background:var(--azul)"><b>${f(i.refeicoes)}</b><span>refeições complementadas</span></div>
    <div class="ind" style="background:var(--laranja)"><b>${f(i.co2)}</b><span>kg de CO₂e evitados</span></div>
    <div class="ind" style="background:var(--teal)"><b>${f(i.agua)}</b><span>litros de água evitados</span></div>
    ${doacoes ? `<div class="ind" style="background:#00695c"><b>${f(i.doacoes)}</b><span>doações concluídas</span></div>` : ''}
    <div class="ind" style="background:#5e35b1"><b>${f(entidades[1])}</b><span>${esc(entidades[0])}</span></div>
    <div class="ind" style="background:#455a64"><b>${i.tmr_minutos === null ? '—' : f(i.tmr_minutos) + ' min'}</b><span>TMR · tempo médio até a reserva</span>
      <small>Meta: menos de ${f(i.metas.tmr_minutos)} min · ${situacao(i.metas.tmr_atingida)}</small></div>
    <div class="ind" style="background:#37474f"><b>${i.tec_percentual === null ? '—' : f(i.tec_percentual) + '%'}</b><span>TEC · taxa de entrega concluída</span>
      <small>Meta: acima de ${f(i.metas.tec_percentual)}% · ${situacao(i.metas.tec_atingida)}</small></div>`;
}

async function carregarIndicadores() {
  try {
    $('indicadores').innerHTML = htmlIndicadores(await api('GET', '/indicadores'));
  } catch {}
}

const formatarCnpj = (d) => String(d ?? '').replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
const formatarTelefone = (d) => String(d ?? '').replace(/^(\d{2})(\d{4,5})(\d{4})$/, '($1) $2-$3');
const SITUACAO = { aprovado: 'Aprovado', pendente: 'Pendente de análise', rejeitado: 'Rejeitado' };

function tagValidade(dias) {
  if (dias < 0) return '<span class="tag t-hoje">vencido</span>';
  if (dias === 0) return '<span class="tag t-hoje">vence hoje</span>';
  if (dias === 1) return '<span class="tag t-breve">vence amanhã</span>';
  if (dias <= 3) return `<span class="tag t-breve">vence em ${dias} dias</span>`;
  return `<span class="tag t-ok">válido ${dias} dias</span>`;
}
const dataBR = (iso) => iso.split('-').reverse().slice(0, 2).join('/');

// "dd/mm hh:mm" a partir de AAAA-MM-DDTHH:MM (horário de Campo Grande).
function textoRetirada(iso) {
  const [d, h] = iso.split('T');
  if (h !== '00:00') return `${dataBR(d)} ${h}`;
  const anterior = new Date(`${d}T12:00:00Z`); // 00:00 é o fim do dia anterior
  anterior.setUTCDate(anterior.getUTCDate() - 1);
  return `fim do dia ${dataBR(anterior.toISOString().slice(0, 10))}`;
}

// Sugestão do horário limite: 18:00 do dia da validade; se já estiver perto ou passado, o fim do dia.
function padraoRetirada(validade, agora = new Date()) {
  const tarde = `${validade}T18:00`;
  return tarde > agoraLocal(agora, 30) ? tarde : `${diaSeguinte(validade)}T00:00`;
}

// "hh:mm–hh:mm" (com a data quando a janela não é de hoje).
function textoJanela(l, agora = new Date()) {
  const [d1, h1] = l.janela_inicio.split('T'), [d2, h2] = l.janela_fim.split('T');
  const hoje = agoraLocal(agora).slice(0, 10);
  if (d1 === d2) return `${d1 === hoje ? '' : dataBR(d1) + ' '}${h1}–${h2}`;
  return `${dataBR(d1)} ${h1} – ${dataBR(d2)} ${h2}`;
}

function cartaoLote(l, doador) {
  const reservado = l.status === 'reservado', expirado = l.status === 'expirado';
  let rodape = '';
  if (doador && expirado) {
    rodape = '<div class="acao"><span class="tag t-hoje">expirado</span></div><div class="meta">O prazo de validade passou sem retirada.</div>';
  } else if (doador && reservado) {
    rodape = `<div class="meta"><b>${esc(l.reservado_por_nome)}</b> retira entre <b>${esc(textoJanela(l))}</b></div>
      <fieldset class="sanitario"><legend>Checklist sanitário obrigatório</legend>
        <label><input type="checkbox" id="emb${l.id}">Embalagem íntegra</label>
        <label><input type="checkbox" id="temp${l.id}">Temperatura adequada</label>
        <label><input type="checkbox" id="val${l.id}">Dentro da validade</label>
      </fieldset>
      <div class="acao"><input id="cod${l.id}" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos" aria-label="Código de retirada">
      <button class="azul" onclick="confirmar(${l.id})">Confirmar retirada</button></div>`;
  } else if (doador) {
    rodape = '<div class="acao"><span class="tag t-ok">disponível</span></div>';
  } else if (reservado) {
    rodape = `<div class="codigo">Código de retirada: <b>${esc(l.codigo)}</b></div>
      <img class="qr-retirada" id="qr${l.id}" alt="QR de retirada; use o código numérico se a imagem não carregar">
      <div class="meta">O doador pode ler o QR com a câmera do celular para abrir a confirmação preenchida.</div>
      <div class="acao"><span class="tag t-res">reservado por você</span></div>
      <div class="meta">Retire entre <b>${esc(textoJanela(l))}</b> e apresente este código ao doador. Passada a janela (mais 30 min de tolerância), a reserva é liberada para outra entidade.</div>`;
  } else {
    const ate = l.retirada_ate ? `, '${esc(l.retirada_ate)}'` : '';
    rodape = `<div id="res${l.id}"><div class="acao">${tagValidade(l.dias)}<button onclick="abrirReserva(${l.id}, '${esc(l.validade)}'${ate})">Reservar retirada</button></div></div>`;
  }
  return `<article class="lote ${reservado ? 'reservado' : ''} ${expirado ? 'expirado' : ''}">
    ${l.tem_foto ? `<img class="miniatura oculto" id="foto${Number(l.id)}" alt="Foto do lote: ${esc(l.alimento)}">` : ''}
    <div class="topo"><div><h3>${esc(l.alimento)}</h3>
      <div class="meta">${doador ? esc(l.categoria) : esc(l.doador)}</div></div>
      <div class="qtd">${Number(l.quantidade_kg)}<small style="font-size:.7rem;color:var(--suave)"> kg</small></div></div>
    ${doador ? '' : `<div class="meta">Bairro: <b>${esc(l.bairro)}</b> · ${l.distancia_km} km de você</div>`}
    <div class="meta">${esc(l.categoria)} · válido até <b>${dataBR(l.validade)}</b></div>
    ${l.retirada_ate ? `<div class="meta">retirar até <b>${esc(textoRetirada(l.retirada_ate))}</b></div>` : ''}
    ${doador && !expirado ? tagValidade(l.dias) : ''}
    ${rodape}</article>`;
}

async function telaLotes() {
  const lotes = await api('GET', '/lotes');

  const ativos = lotes.filter((l) => l.status !== 'expirado'), expirados = lotes.filter((l) => l.status === 'expirado');

  $('conteudo').innerHTML = '<div id="aviso"></div>' +
    (doador ? '<h2 class="secao">Ativos</h2>' : '') +

    (expirados.length ? `<h2 class="secao">Expirados</h2>${grade(expirados)}` : '');
  imagensTemporarias.forEach((url) => URL.revokeObjectURL(url)); imagensTemporarias = [];
  lotes.filter((l) => l.tem_foto).forEach((l) => carregarFoto(l.id));
  if (!doador) lotes.filter((l) => l.status === 'reservado').forEach((l) => carregarQR(l.id));

async function respostaProtegida(url) {
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) sair();
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || 'Não foi possível carregar o documento.');
  return r;
}

async function carregarQR(id) {
  const elemento = $('qr' + id);
  try {
    const r = await respostaProtegida(`/lotes/${id}/qrcode`);
    const url = URL.createObjectURL(await r.blob());
    if (!elemento.isConnected) { URL.revokeObjectURL(url); return; }
    imagensTemporarias.push(url); elemento.src = url;
  } catch { elemento.alt = 'QR indisponível. Apresente o código numérico ao doador.'; }
}

// A foto só é servida a quem pode ver o lote, então vai com o token (blob), nunca por URL pública.
async function carregarFoto(id) {
  const elemento = $('foto' + id);
  try {
    const r = await respostaProtegida(`/lotes/${id}/foto`);
    const url = URL.createObjectURL(await r.blob());
    if (!elemento.isConnected) { URL.revokeObjectURL(url); return; }
    imagensTemporarias.push(url); elemento.onerror = () => elemento.remove(); elemento.src = url; elemento.classList.remove('oculto');
  } catch { elemento.remove(); }
}

function linkRetirada() {
  const hash = typeof window === 'undefined' ? '' : window.location.hash;
  const m = /^#retirada\/([1-9]\d{0,9})\/(\d{6})$/.exec(hash);
  return m && Number(m[1]) <= 2147483647 ? { id: Number(m[1]), codigo: m[2] } : null;
}

function aplicarLinkRetirada(lotes) {
  const link = linkRetirada();
  if (!link) return;
  if (usuario.perfil !== 'doador') { msg('aviso', 'Entre como o doador deste lote para confirmar a retirada.'); return; }
  const lote = lotes.find((l) => l.id === link.id && l.status === 'reservado');
  if (!lote) { msg('aviso', 'Este lote não está reservado para retirada nesta conta. Confira o doador e a reserva.'); return; }
  const campo = $('cod' + link.id);
  campo.value = link.codigo; campo.focus(); campo.scrollIntoView({ block: 'center' });

const FOTO_LADO_MAX = 1024, FOTO_BYTES_MAX = 400 * 1024;

function lerBase64(blob) {
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onload = () => resolve(String(leitor.result).split(',')[1] || '');
    leitor.onerror = () => reject(new Error('Não foi possível ler a imagem.'));
    leitor.readAsDataURL(blob);
  });
}

// Reduz a imagem no navegador: lado maior de até 1024 px, JPEG (qualidade 0,7; cai se passar de 400 KB).
async function reduzirImagem(arquivo) {
  if (!arquivo.type.startsWith('image/')) throw new Error('Escolha um arquivo de imagem (JPEG ou PNG).');
  const url = URL.createObjectURL(arquivo);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('Não foi possível ler a imagem escolhida. Use JPEG ou PNG.'));
      i.src = url;
    });
    const escala = Math.min(1, FOTO_LADO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.naturalWidth * escala));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * escala));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); // PNG transparente → fundo branco
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    for (const qualidade of [0.7, 0.5, 0.35]) {
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', qualidade));
      if (blob && blob.size <= FOTO_BYTES_MAX) return { base64: await lerBase64(blob), blob };
    }
    throw new Error('Não foi possível reduzir a imagem para até 400 KB. Escolha outra foto.');
  } finally { URL.revokeObjectURL(url); }
}

function escolherFoto(input) {
  const previa = $('pPrevia');
  previa.classList.add('oculto'); previa.removeAttribute('src');
  msg('erroLote', '');
  const arquivo = input.files && input.files[0];
  if (!arquivo) { fotoPronta = Promise.resolve(null); return; }
  const pronta = reduzirImagem(arquivo);
  fotoPronta = pronta;
  pronta.then((r) => {
    if (fotoPronta !== pronta) return;
    previa.onload = () => URL.revokeObjectURL(previa.src);
    previa.src = URL.createObjectURL(r.blob); previa.classList.remove('oculto');
  }).catch((e) => {
    if (fotoPronta !== pronta) return;
    input.value = ''; fotoPronta = Promise.resolve(null); msg('erroLote', e.message);
  });
}

// O sino e a central funcionam só com HTTP; o WebSocket apenas antecipa o aviso e a recarga.
let notificacoes = [], naoLidas = 0, central = false;
let ws = null, tentativasWs = 0, esperaWs = null, avisoWs = null;

function renderSino() {
  const c = $('contador');

function renderCentral() {
  const quando = (iso) => new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Campo_Grande', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const itens = notificacoes.map((n) => `<div class="notif ${n.lida ? '' : 'nova'} ${n.urgente ? 'urgente' : ''}">
      ${n.urgente ? '<span class="tag t-hoje">urgente</span> ' : ''}${esc(n.mensagem)}
      <small>${esc(quando(n.criado_em))}${n.lida ? '' : `<button onclick="marcarLida(${Number(n.id)})">Marcar como lida</button>`}</small></div>`).join('');
  $('central').innerHTML = `<h2>Notificações<button onclick="marcarTodasLidas()" ${naoLidas ? '' : 'disabled'}>Marcar todas como lidas</button></h2>` +
    (itens || '<div class="vazio">Nenhuma notificação por enquanto.</div>');
}

async function carregarNotificacoes() {
  if (!token) return;
  try {
    const d = await api('GET', '/notificacoes');
    notificacoes = d.itens; naoLidas = d.nao_lidas;
    renderSino();
  } catch {}
}

function alternarCentral() {
  central = !central;
  $('central').classList.toggle('oculto', !central);
  $('sino').setAttribute('aria-expanded', String(central));
  if (central) { renderCentral(); carregarNotificacoes(); }
}

async function marcarLida(id) {
  try {
    await api('PUT', `/notificacoes/${id}/lida`);
    const n = notificacoes.find((x) => x.id === id);
    if (n && !n.lida) { n.lida = true; naoLidas = Math.max(0, naoLidas - 1); }
    renderSino();
  } catch {}
}

async function marcarTodasLidas() {
  try {
    await api('PUT', '/notificacoes/lidas');
    notificacoes.forEach((n) => { n.lida = true; });
    naoLidas = 0;
    renderSino();
  } catch {}
}

function mostrarAviso(texto, urgente, acao) {
  const t = $('toast');
  t.className = `toast ${urgente ? 'urgente' : ''}`;
  t.innerHTML = esc(texto) + (acao ? ` <button onclick="irPara('lotes')">${esc(acao)}</button>` : '');
  clearTimeout(avisoWs);
  avisoWs = setTimeout(() => t.classList.add('oculto'), 8000);
}

// Recarrega a lista sem apagar um formulário aberto ou um campo em edição.
function recarregarLista() {
  if (!usuario || abaAtual !== 'lotes') return false;
  if (document.querySelector('#conteudo .janela') || document.activeElement?.closest?.('#conteudo')) return false;
  telaLotes().catch(() => {});
  return true;
}

function receberNotificacao(n) {
  if (!n || typeof n.tipo !== 'string' || !Number.isInteger(n.id) || typeof n.mensagem !== 'string') return;
  if (!notificacoes.some((x) => x.id === n.id)) {
    notificacoes.unshift(n); naoLidas += 1;
    renderSino();
  }
  const atualizada = recarregarLista();
  mostrarAviso(n.mensagem, n.urgente, atualizada ? null : 'Atualizar lista');
}

function iniciarTempoReal() {
  fecharConexao();
  if (!token || typeof WebSocket === 'undefined') return;
  const credencial = token;
  const conexao = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`);
  ws = conexao;
  conexao.onopen = () => conexao.send(credencial); // o JWT vai no primeiro frame, nunca na URL
  conexao.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    if (m.tipo === 'autenticado') {
      const reconectou = tentativasWs > 0;
      tentativasWs = 0;
      if (reconectou) { carregarNotificacoes(); recarregarLista(); }
      return;
    }
    receberNotificacao(m);
  };
  conexao.onclose = (ev) => {
    if (ws !== conexao) return;
    ws = null;
    // Token recusado/expirado: a consulta HTTP decide se a sessão acabou (401 → sair).
    if (ev.code === 1008) carregarNotificacoes();
    // 4001: esta aba cedeu a vaga a outra da mesma conta. Reconectar expulsaria uma aba em ciclo; as
    // notificações seguem disponíveis pelo sino e pela consulta HTTP até a página ser recarregada.
    if (ev.code === 4001) {
      carregarNotificacoes();
      mostrarAviso('Tempo real suspenso: esta conta tem muitas abas abertas. Feche outras abas e recarregue a página.', false);
      return;
    }
    if (!token) return;
    esperaWs = setTimeout(iniciarTempoReal, Math.min(30000, 1000 * 2 ** tentativasWs));
    tentativasWs += 1;
  };
  conexao.onerror = () => {};
}

function fecharConexao() {
  clearTimeout(esperaWs);
  const conexao = ws; ws = null;
  if (conexao) { conexao.onclose = null; try { conexao.close(); } catch {} }
}

function pararTempoReal() {
  fecharConexao(); clearTimeout(avisoWs); tentativasWs = 0;
  notificacoes = []; naoLidas = 0; central = false;
  if (typeof document !== 'undefined') {
    $('central').classList.add('oculto'); $('toast').classList.add('oculto');
    $('sino').setAttribute('aria-expanded', 'false'); renderSino();
  }
}

// ---------- Início ----------
(async () => {
  try { $('cBairro').innerHTML = (await (await fetch('/bairros')).json()).map((b) => `<option>${esc(b)}</option>`).join(''); } catch {}
  if (token && usuario) mostrarApp();
  else if (linkRetirada()) msg('erroLogin', 'Entre como doador para confirmar a retirada indicada pelo QR.', 'ok');
})();
if (typeof window !== 'undefined') window.addEventListener('hashchange', () => {
  if (token && usuario) irPara('lotes');
  else if (linkRetirada()) msg('erroLogin', 'Entre como doador para confirmar a retirada indicada pelo QR.', 'ok');
});
</script>
